<div class="container-fluid px-2 px-lg-4 mt-4 mt-lg-5 mb-3" data-aos="fade-down" data-aos-duration="600">
    <div class="row g-0">
        <div class="col-12">
            <nav aria-label="breadcrumb" class="bg-white rounded-pill px-3 py-2 shadow-sm border border-light d-flex align-items-center justify-content-start w-100 ms-0" style="max-width: 100%; margin-left: 0; margin-right: 0; border-left: 0; border-right: 0;">
                <ol class="breadcrumb mb-0 align-items-center small fw-medium flex-wrap" style="margin-left: 0; padding-left: 0;">
                    <li class="breadcrumb-item">
                        <a href="{% url 'index' %}" class="text-decoration-none text-muted hover-success d-inline-flex align-items-center gap-1 transition-all">
                            <i class="bi bi-house-door-fill text-success"></i>
                            <span>Inicio</span>
                        </a>
                    </li>

                    {% if show_panel or request.GET.from == 'panel' or 'panel-rapido' in request.META.HTTP_REFERER %}
                    <li class="breadcrumb-item">
                        <a href="{% url 'panel_rapido' %}" class="text-decoration-none text-muted hover-success d-inline-flex align-items-center gap-1 transition-all">
                            <i class="bi bi-compass-fill text-success"></i>
                            <span>Panel Rápido</span>
                        </a>
                    </li>
                    {% endif %}

                    <li class="breadcrumb-item active fw-bold text-dark d-inline-flex align-items-center gap-1" aria-current="page">
                        {% if current_icon %}
                            <i class="{{ current_icon }} me-1 text-success"></i>
                        {% endif %}
                        <span>{{ current_title }}</span>
                    </li>
                </ol>
            </nav>
        </div>
    </div>
</div>
